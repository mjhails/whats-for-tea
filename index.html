<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What's for Tea?</title>
<meta name="description" content="Plan the week's family teas, get the shopping list and keep your favourite meals in one place.">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What's for Tea?">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
<div id="boot" class="boot"><svg viewBox="0 0 64 64" aria-hidden="true" class="authlogo"><rect width="64" height="64" rx="16" fill="#D85A30"/><path d="M14 33h36a18 18 0 0 1-36 0z" fill="#FFFFFF"/><path d="M24 25c0-3 2-4 2-7M32 25c0-3 2-4 2-7M40 25c0-3 2-4 2-7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/></svg></div>

<div id="auth" class="authwrap" hidden>
  <div class="authcard">
    <svg viewBox="0 0 64 64" aria-hidden="true" class="authlogo"><rect width="64" height="64" rx="16" fill="#D85A30"/><path d="M14 33h36a18 18 0 0 1-36 0z" fill="#FFFFFF"/><path d="M24 25c0-3 2-4 2-7M32 25c0-3 2-4 2-7M40 25c0-3 2-4 2-7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
    <p class="brand" style="margin:6px 0 0">What's for Tea?</p>
    <h1 id="authTitle" style="font-size:28px">Sign in</h1>
    <p class="hint">Use the same email and password as Kcal Tracker, or continue with Google.</p>
    <form id="authForm" class="authform">
      <input type="text" id="authName" placeholder="Your name" autocomplete="name" hidden>
      <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required>
      <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" minlength="6" required>
      <p class="err" id="authError" aria-live="polite"></p>
      <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Sign in</button>
    </form>
    <button type="button" class="btn btn-block" id="authGoogle">Continue with Google</button>
    <button type="button" class="linkbtn" id="authToggle">New here? Create an account</button>
  </div>
</div>

<div id="appRoot" hidden>
<div class="app">
  <header class="top"><div><p class="brand">What's for Tea?</p><h1 id="pageTitle">This week</h1><p class="sub" id="weekLabel"></p></div><div class="hacts" id="hacts"></div></header>

  <section id="p-week" role="tabpanel" aria-labelledby="t-week">
    <div class="tiles" id="days"></div>
    <button type="button" class="btn btn-primary btn-block" id="planBtn" data-action="plan">Plan a new week</button>
    <p class="foot">Tap a meal to see the recipe, swap it, lock it in or take a night off. Locked meals stay put when you re-plan.</p>
  </section>

  <section id="p-shop" role="tabpanel" aria-labelledby="t-shop" hidden>
    <textarea id="copyFallback" class="out" readonly hidden aria-label="Shopping list text"></textarea>
    <div id="shop"></div>
    <p class="hint" id="shopLabel" style="text-align:center"></p>
    <button type="button" class="btn btn-block" id="untickBtn" data-action="untick">Untick everything</button>
  </section>

  <section id="p-meals" role="tabpanel" aria-labelledby="t-meals" hidden>
    <input type="search" class="search" id="libSearch" placeholder="Search meals or ingredients" aria-label="Search meals">
    <div class="filters" id="filters">
      <button type="button" class="fbtn" data-action="filter" data-f="all">All</button>
      <button type="button" class="fbtn" data-action="filter" data-f="simple">Familiar</button>
      <button type="button" class="fbtn" data-action="filter" data-f="different">A bit different</button>
      <button type="button" class="fbtn" data-action="filter" data-f="mine">Yours</button>
    </div>
    <div class="filters meats" id="meatFilters" role="group" aria-label="Meats to include. Tap to turn a type on or off."></div>
    <ul class="lib" id="lib"></ul>
    <p class="foot" id="libStats"></p>
    <p class="foot" id="syncNote"></p>
  </section>
</div>

<nav class="tabbar" aria-label="Sections"><div class="tabbar-in" role="tablist">
  <button type="button" class="tab" role="tab" id="t-week" data-action="tab" data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Week</span></button>
  <button type="button" class="tab" role="tab" id="t-shop" data-action="tab" data-tab="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.3 10.5a2 2 0 0 1-2 1.5H8.3a2 2 0 0 1-2-1.5z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span>Shopping</span></button>
  <button type="button" class="tab" role="tab" id="t-meals" data-action="tab" data-tab="meals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8.5h6"/></svg><span>Meals</span></button>
</div></nav>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-action="close"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="panel"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
